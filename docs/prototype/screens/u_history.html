<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Career Copilot · 面试记录</title>
<style>/* ============================================================
   AI Career Copilot · High-Fidelity Prototype Design System
   Calm / professional / portfolio-grade. No AI-template feel.
   ============================================================ */

:root{
  /* 与 EXE UI v4 完全对齐的浅灰白 SaaS 工作台令牌 */
  --bg:#F5F6F7;
  --bg-soft:#FAFAFA;
  --panel:#FFFFFF;
  --panel-2:#FCFDFB;

  --ink:#202124;
  --ink-2:#7B818A;
  --ink-3:#9AA0A6;
  --muted:#8A8F98;

  --line:#E8EAED;
  --line-2:#F0F2F4;
  --line-strong:#DDE0E4;

  /* 主强调色：荧光黄绿（与 EXE 一致） */
  --pink:#C8F36A;
  --pink-soft:#F1FBD4;
  --pink-ink:#2E3B13;
  --pink-line:#D9ECA0;

  --green:#5B8C4A;
  --green-soft:#EEF3EC;
  --blue:#3E7CB1;
  --blue-soft:#EAF1F8;
  --amber:#C9A227;
  --amber-soft:#FBF6E6;
  --purple:#9A7BB5;

  --shadow-sm:0 1px 2px rgba(32,33,36,.04),0 1px 3px rgba(32,33,36,.05);
  --shadow-md:0 6px 18px rgba(32,33,36,.06),0 2px 6px rgba(32,33,36,.04);
  --shadow-lg:0 16px 40px rgba(32,33,36,.10);

  --r:14px;
  --r-sm:10px;
  --r-lg:18px;

  --font:'Inter','Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,-apple-system,sans-serif;
  --sidebar-w:236px;
  --topbar-h:72px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
::selection{background:var(--pink-soft);color:var(--pink-ink)}

/* ---------- App shell ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);
  background:var(--panel);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
  padding:20px 14px;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .logo{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(180deg,#fff,#F1FBD4);
  border:1px solid var(--line);
  display:grid;place-items:center;font-size:18px;
}
.brand .name{font-weight:650;font-size:15px;letter-spacing:-.01em}
.brand .sub{font-size:11px;color:var(--ink-3);margin-top:-2px}

.nav-group{margin-top:6px}
.nav-label{font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;padding:14px 10px 6px}
.nav-link{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:10px;color:var(--ink-2);
  font-size:13.5px;font-weight:500;transition:all .15s ease;
  margin-bottom:2px;
}
.nav-link .ico{width:18px;text-align:center;opacity:.8}
.nav-link:hover{background:var(--bg-soft);color:var(--ink)}
.nav-link.active{background:var(--pink);color:var(--pink-ink)}
.nav-link.active .ico{opacity:1}
.sidebar-foot{margin-top:auto;padding:10px;border-top:1px solid var(--line)}
.me{display:flex;align-items:center;gap:10px}
.me .avatar{width:34px;height:34px;border-radius:50%;background:var(--pink-soft);border:1px solid var(--line);display:grid;place-items:center;font-size:16px}
.me .nm{font-size:12.5px;font-weight:600}
.me .rl{font-size:11px;color:var(--ink-3)}

.workspace-switch{display:flex;gap:6px;background:var(--bg-soft);border:1px solid var(--line);border-radius:10px;padding:4px;margin-top:10px}
.workspace-switch button{flex:1;padding:7px 0;border-radius:7px;font-size:12px;font-weight:600;color:var(--ink-2);transition:all .15s}
.workspace-switch button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow-sm)}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  height:var(--topbar-h);flex:0 0 var(--topbar-h);
  border-bottom:1px solid var(--line);background:rgba(247,247,245,.8);
  backdrop-filter:saturate(1.2) blur(8px);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;position:sticky;top:0;z-index:20;
}
.topbar h1{font-size:16px;font-weight:650;letter-spacing:-.01em}
.topbar .crumb{font-size:12px;color:var(--ink-3);margin-top:1px}
.topbar-right{display:flex;align-items:center;gap:14px}
.topbar-right .pill{font-size:11px;color:var(--ink-3);border:1px solid var(--line);padding:5px 10px;border-radius:999px;background:var(--panel)}
.proto-flag{font-size:10.5px;letter-spacing:.06em;color:var(--pink-ink);background:var(--pink-soft);border:1px solid var(--pink-line);padding:5px 10px;border-radius:999px;font-weight:600}

.view{padding:30px 32px 60px;max-width:1280px;width:100%;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.page-head{margin-bottom:22px}
.page-head .eyebrow{font-size:12px;color:var(--pink-ink);font-weight:600;letter-spacing:.04em}
.page-head h2{font-size:25px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.page-head p{color:var(--ink-2);margin-top:6px;max-width:680px;font-size:13.5px}

/* ---------- Layout grid ---------- */
.grid{display:grid;gap:18px}
.cols-2{grid-template-columns:1fr 1fr}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-4{grid-template-columns:repeat(4,1fr)}
.cols-5{grid-template-columns:repeat(5,1fr)}
.span-2{grid-column:span 2}
.split{display:grid;grid-template-columns:340px 1fr;gap:22px;align-items:start}
.split-r{display:grid;grid-template-columns:1fr 340px;gap:22px;align-items:start}

/* ---------- Card ---------- */
.card{
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:20px;box-shadow:var(--shadow-sm);
  transition:box-shadow .2s ease, transform .2s ease;
}
.card.hov:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.card-title{font-size:13px;font-weight:650;color:var(--ink);display:flex;align-items:center;line-height:1.3;gap:8px}
.card-title .dot{width:7px;height:7px;border-radius:50%;background:var(--pink);transform:translateY(0.5px)}
.card-sub{font-size:12px;color:var(--ink-2);margin-top:3px}
.card-pad-sm{padding:16px}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 18px;border-radius:11px;font-size:13.5px;font-weight:600;
  transition:all .16s ease;white-space:nowrap;
}
.btn-primary{background:var(--pink);color:var(--pink-ink)}
.btn-primary:hover{background:#B7E84F;transform:translateY(-1px);box-shadow:var(--shadow-md)}
.btn-secondary{background:var(--panel);color:var(--ink);border:1px solid var(--line-strong)}
.btn-secondary:hover{background:var(--bg-soft);border-color:var(--ink-3)}
.btn-ghost{background:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:var(--bg-soft);color:var(--ink)}
.btn-pink{background:var(--pink-soft);color:var(--pink-ink);border:1px solid var(--pink-line)}
.btn-pink:hover{background:#ECF7D6}
.btn-sm{padding:7px 13px;font-size:12.5px;border-radius:9px}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* ---------- Tags ---------- */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);background:var(--panel)}
.tag-pink{background:var(--pink-soft);color:var(--pink-ink);border-color:var(--pink-line)}
.tag-green{background:var(--green-soft);color:#4d6b48;border-color:#DCE7D8}
.tag-blue{background:var(--blue-soft);color:#46627e;border-color:#DCE6EE}
.tag-amber{background:var(--amber-soft);color:#8a6d10;border-color:#EFE4BD}
.tag-gray{background:var(--bg-soft);color:var(--ink-3);border-color:var(--line)}
.tag-soft{background:var(--bg-soft);color:var(--ink-2)}

/* ---------- Inputs ---------- */
.input{
  width:100%;padding:11px 14px;border:1px solid var(--line-strong);
  border-radius:11px;font-size:13.5px;background:var(--panel);color:var(--ink);
  transition:border-color .15s, box-shadow .15s;font-family:inherit;
}
.input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(24,24,27,.06)}
.input::placeholder{color:var(--ink-3)}
textarea.input{min-height:120px;resize:vertical;line-height:1.6}
label.field{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:7px}

/* ---------- Progress / bars ---------- */
.progress{height:8px;background:var(--line-2);border-radius:999px;overflow:hidden}
.progress>.bar{height:100%;background:var(--ink);border-radius:999px;transition:width 1s cubic-bezier(.2,.7,.3,1)}
.progress.pink>.bar{background:var(--pink)}
.progress.green>.bar{background:var(--green)}
.meter{display:flex;align-items:center;gap:10px}
.meter .lab{font-size:12.5px;color:var(--ink-2);width:96px;flex:0 0 96px}
.meter .val{font-size:12.5px;font-weight:650;width:38px;text-align:right;flex:0 0 38px}
.meter .track{flex:1;height:7px;background:var(--line-2);border-radius:999px;overflow:hidden}
.meter .track>i{display:block;height:100%;background:var(--ink);border-radius:999px}

/* ---------- Avatar ---------- */
.avatar{width:38px;height:38px;border-radius:50%;background:var(--pink-soft);border:1px solid var(--line);display:grid;place-items:center;font-size:17px;flex:0 0 38px}
.avatar.sm{width:30px;height:30px;font-size:14px;flex-basis:30px}
.avatar.lg{width:52px;height:52px;font-size:24px;flex-basis:52px}
.avatar.blue{background:var(--blue-soft);border-color:#DCE6EE}
.avatar.green{background:var(--green-soft);border-color:#DCE7D8}
.avatar.amber{background:var(--amber-soft);border-color:#EFE4BD}
.avatar.purple{background:#F3EEF7;border-color:#E6DCF0}

/* ---------- Stat ---------- */
.stat .k{font-size:12px;color:var(--ink-3);font-weight:500}
.stat .v{font-size:27px;font-weight:700;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:14px;color:var(--ink-3);font-weight:600}
.stat .d{font-size:12px;color:var(--green);font-weight:600;margin-top:3px}
.stat .d.down{color:#D45D4D}

/* ---------- List / rows ---------- */
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.row:last-child{border-bottom:none}
.row .main{flex:1;min-width:0}
.row .ttl{font-size:13.5px;font-weight:600}
.row .meta{font-size:12px;color:var(--ink-3);margin-top:1px}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink-2)}
.kv .v{font-weight:600}

/* ---------- Dropdown / select ---------- */
.select{
  position:relative;display:inline-block;
}
.select>button{
  display:flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--line-strong);
  border-radius:11px;background:var(--panel);font-size:13px;font-weight:600;color:var(--ink);min-width:150px;justify-content:space-between;
}
.select .menu{position:absolute;top:calc(100% + 6px);left:0;min-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-md);padding:6px;z-index:30;display:none}
.select.open .menu{display:block}
.select .menu button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:8px;font-size:13px;color:var(--ink-2)}
.select .menu button:hover{background:var(--bg-soft);color:var(--ink)}
.select .menu button.on{color:var(--ink);font-weight:650}

/* ---------- Tabs ---------- */
.tabs{display:inline-flex;background:var(--bg-soft);border:1px solid var(--line);border-radius:11px;padding:4px;gap:2px}
.tabs button{padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink-2);transition:all .15s}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow-sm)}

/* ---------- Chat / interview ---------- */
.chat{display:flex;flex-direction:column;gap:14px}
.bubble{max-width:86%;padding:13px 16px;border-radius:16px;font-size:13.5px;line-height:1.6}
.bubble.q{background:var(--ink);color:#fff;align-self:flex-start;border-bottom-left-radius:5px}
.bubble.a{background:var(--panel);border:1px solid var(--line);align-self:flex-end;border-bottom-right-radius:5px}
.bubble .who{font-size:11px;opacity:.7;margin-bottom:4px;display:block}

/* ---------- Agent status ---------- */
.agent-row{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line-2)}
.agent-row:last-child{border-bottom:none}
.status-dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;position:relative}
.status-dot.run{background:var(--green)}
.status-dot.run::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--green);opacity:.4;animation:ping 1.4s ease-out infinite}
.status-dot.done{background:var(--blue)}
.status-dot.wait{background:var(--ink-3)}
.status-dot.warn{background:var(--amber)}
@keyframes ping{0%{transform:scale(.7);opacity:.6}100%{transform:scale(1.6);opacity:0}}

/* ---------- Empty / loading ---------- */
.empty{text-align:center;padding:50px 20px;color:var(--ink-3)}
.empty .ill{font-size:42px;opacity:.5;margin-bottom:10px}
.empty p{font-size:13px}
.skeleton{background:linear-gradient(90deg,var(--line-2) 25%,#EDEDE8 37%,var(--line-2) 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:8px;height:14px;margin:8px 0}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}

/* ---------- Toast ---------- */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;transition:all .3s;z-index:90;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast-card{background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:9px}
.toast-card .ic{color:var(--green)}

/* ---------- Modal ---------- */
.modal-mask{position:fixed;inset:0;background:rgba(24,24,27,.32);backdrop-filter:blur(2px);display:grid;place-items:center;z-index:80;animation:fade .2s ease}
.modal{background:var(--panel);border-radius:var(--r-lg);width:min(460px,92vw);padding:26px;box-shadow:var(--shadow-lg);animation:pop .25s cubic-bezier(.2,.8,.3,1)}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.modal h3{font-size:18px;font-weight:700;margin-bottom:8px}
.modal p{color:var(--ink-2);font-size:13.5px;margin-bottom:18px}

/* ---------- Hero / upload ---------- */
.upload-zone{
  border:1.8px dashed var(--line-strong);border-radius:var(--r-lg);
  background:var(--panel-2);padding:54px 30px;text-align:center;transition:all .2s;
}
.upload-zone:hover,.upload-zone.drag{border-color:var(--pink);background:var(--pink-soft)}
.upload-ill{font-size:46px;margin-bottom:12px}
.upload-zone h3{font-size:18px;font-weight:700}
.upload-zone p{color:var(--ink-2);font-size:13px;margin-top:6px}

/* ---------- Misc ---------- */
.muted{color:var(--ink-3)}
.small{font-size:12px}
.center{text-align:center}
.right{text-align:right}
.flex{display:flex}
.between{display:flex;justify-content:space-between;align-items:center}
.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}.gap-20{gap:20px}
.wrap{flex-wrap:wrap}
.items-center{align-items:center}
.mt-4{margin-top:4px}.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mt-20{margin-top:20px}.mt-24{margin-top:24px}
.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}.mb-20{margin-bottom:20px}.mb-24{margin-bottom:24px}
.divider{height:1px;background:var(--line-2);margin:16px 0}
.section-note{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:7px}
.badge-step{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;font-weight:700;flex:0 0 22px;box-sizing:border-box}
.flow-hint{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);background:var(--panel);border:1px solid var(--line);padding:7px 13px;border-radius:999px}
.note-line{border-left:3px solid var(--pink);background:var(--pink-soft);padding:11px 14px;border-radius:0 10px 10px 0;font-size:12.5px;color:var(--pink-ink)}
.mock-tag{display:inline-flex;align-items:center;line-height:1;font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--amber);background:var(--amber-soft);border:1px solid #EFE4BD;padding:2px 7px;border-radius:6px;vertical-align:middle;margin-left:8px}

/* donut legend */
.legend{display:flex;flex-direction:column;gap:9px}
.legend .li{display:flex;align-items:center;gap:9px;font-size:12.5px}
.legend .sw{width:11px;height:11px;border-radius:3px;flex:0 0 11px}

/* ---------- Charts (shared chart toolkit) ---------- */
.chart{display:block;width:100%;height:auto;overflow:visible}
.chart-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px}
.chart-legend .li{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2)}
.chart-legend .sw{width:10px;height:10px;border-radius:3px;flex:0 0 10px}
.chart-note{font-size:11.5px;color:var(--ink-3);margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);display:block;line-height:1.5}
.chart-note .mock-tag{margin-left:0;margin-right:8px}
.grid-line{stroke:var(--line-2);stroke-width:1}
.axis-lab{fill:var(--ink-3);font-size:10px;font-family:var(--font)}
.bar-lab{fill:var(--ink-2);font-size:10.5px;font-family:var(--font)}
.bar-val{fill:var(--ink);font-size:10.5px;font-weight:650;font-family:var(--font)}
.spark{display:block}
.ring-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ring-row .ring-meta{flex:1;min-width:120px}
.chart-empty{display:grid;place-items:center;min-height:150px;color:var(--ink-3);font-size:12.5px;gap:6px}
.chart-empty .ill{font-size:26px;opacity:.45}

/* bar entrance animation (used by charts + meters) */
@keyframes growBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growBarY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.chart rect.anim-x{transform-origin:left center;animation:growBar .7s cubic-bezier(.2,.7,.3,1) both}
.chart rect.anim-y{transform-origin:center bottom;animation:growBarY .7s cubic-bezier(.2,.7,.3,1) both}
/* 环形图中心数字：HTML 覆盖层（不依赖 SVG text-anchor） */
.ring-wrap{position:relative;display:inline-flex;vertical-align:middle}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;line-height:1.15}
.ring-center b{font-weight:700;color:#18181B;letter-spacing:-.01em}
.ring-center i{font-style:normal;font-size:10.5px;color:#A1A1AA;margin-top:2px}
.ring-row .ring-wrap{flex:0 0 auto}
.meter .track>i{transition:width .8s cubic-bezier(.2,.7,.3,1)}

/* ---------- nav: star + agents-active + 开始使用 ---------- */
.nav-star{color:#E0B341;font-size:11px;margin-left:2px}
.agents-active{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--green);padding:0 2px 12px}
.agents-active .pulse{width:8px;height:8px;border-radius:50%;background:var(--green);position:relative}
.agents-active .pulse::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--green);opacity:.45;animation:ping 1.6s ease-out infinite}
.btn-block{width:100%;justify-content:center;margin-top:4px}

/* ---------- 简历解析 4 步向导 ---------- */
.wizard{display:flex;align-items:flex-start;gap:0}
.wz-step{flex:1;position:relative;text-align:center}
.wz-n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--bg-soft);border:1.5px solid var(--line);color:var(--ink-2);font-weight:700;font-size:13px;transition:all .2s}
.wz-t{font-size:12.5px;font-weight:600;margin-top:7px;color:var(--ink-2)}
.wz-s{font-size:10.5px;color:var(--ink-3);margin-top:2px}

/* SVG 文本宽度估算：Ardot 导入会丢失 text-anchor/dominant-baseline，
   故所有图表文字一律使用默认 start 锚点 + 计算偏移实现居中/右对齐 */
function estW(s,fs){s=String(s);var w=0;for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);w+=((c>=0x2E80&&c<=0x9FFF)||(c>=0xFF00&&c<=0xFFEF))?fs:fs*0.56;}return w;}
/* 居中/右对齐：返回 start 锚点 x；超宽自动缩字号（下限 8px） */
function fitFs(s,fs,maxW){var w=estW(s,fs);return w>maxW?Math.max(8,fs*maxW/w):fs;}
function txC(cx,s,fs,maxW){fs=fitFs(s,fs,maxW||1e4);return [ (cx-estW(s,fs)/2).toFixed(1), fs ];}
function txR(rx,s,fs){return (rx-estW(s,fs)).toFixed(1);}

  var grid='';[0.25,0.5,0.75,1].forEach(function(f){
    var p=dims.map(function(_,i){return pt(R*f,i).map(function(n){return n.toFixed(1);}).join(',');}).join(' ');

}
function donut(segs){
  var total=segs.reduce(function(a,s){return a+s.v;},0),cx=90,cy=90,r=62,sw=22,acc=0,paths='';
  segs.forEach(function(s){

    var x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    paths+=`<path d="M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${lg} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}" fill="none" stroke="${s.color}" stroke-width="${sw}" stroke-linecap="butt"/>`;
    acc+=f;
  });
  return `<span class="ring-wrap"><svg viewBox="0 0 180 180" width="150" height="150"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#F0F0EC" stroke-width="${sw}"/>${paths}</svg><span class="ring-center"><b style="font-size:20px">${total}</b><i>份</i></span></span>`;

}
function lineChart(vals){
  var W=580,H=160,pad=12,max=Math.max.apply(null,vals)*1.12,n=vals.length;

  var grid='';[0.25,0.5,0.75].forEach(function(f){var y=pad+f*(H-2*pad);grid+=`<line x1="${pad}" y1="${y.toFixed(1)}" x2="${W-pad}" y2="${y.toFixed(1)}" stroke="#EFEFEA"/>`;});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${grid}<polygon points="${area}" fill="rgba(200,243,106,.10)"/><polyline points="${pts}" fill="none" stroke="#C8F36A" stroke-width="2.5" stroke-linejoin="round"/><circle cx="${xs(n-1).toFixed(1)}" cy="${ys(vals[n-1]).toFixed(1)}" r="4" fill="#C8F36A"/></svg>`;
}

/* ---------- 统一图表工具库（每个功能模块共用） ---------- */

}
/* 垂直柱状图 */
function vBars(rows,opt){

  var W=opt.w||Math.max(320,padL+padR+n*(opt.step||66)),plotH=H-padT-padB,step=(W-padL-padR)/n;

       `<text class="axis-lab" x="4" y="${(y+3.5).toFixed(1)}">${Math.round(max*f)}</text>`;

      `<text class="bar-val" x="${tc[0]}" y="${(y-6).toFixed(1)}" font-size="${tc[1].toFixed(1)}">${vt}</text>`+

  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}${bars}</svg>`;

function hBarsRich(rows,opt){

  var tx=labW+8,tw=W-labW-8-valW-padX;
  var out=rows.map(function(r,i){

      `<text class="bar-val" x="${txR(W-padX,vt,10.5)}" y="${y+14}">${vt}</text>`;

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${out}</svg>`;

/* 分组柱状图（两组对比） */
function gBars(rows,aLab,bLab,opt){

  var max=opt.max||Math.max.apply(null,rows.map(function(r){return Math.max(r.a,r.b);}))*1.2;

       `<text class="axis-lab" x="4" y="${(y+3).toFixed(1)}">${Math.round(max*f)}</text>`;

      `<rect class="anim-y" x="${(cx+2).toFixed(1)}" y="${(padT+plotH-hb).toFixed(1)}" width="${bw}" height="${hb.toFixed(1)}" rx="4" fill="#18181B"/>`+
      `<text class="bar-lab" x="${tl[0]}" y="${(H-padB+16).toFixed(1)}" font-size="${tl[1].toFixed(1)}">${esc(r.label)}</text>`;

         `<rect x="${padL+72}" y="9" width="9" height="9" rx="2" fill="#18181B"/><text class="axis-lab" x="${padL+86}" y="17">${esc(bLab)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}${bars}${lg}</svg>`;

/* 环形指标 */
function ring(pct,opt){
  opt=opt||{};

  el.style.transition='stroke-dashoffset .9s cubic-bezier(.2,.7,.3,1)';

  el.setAttribute('stroke-dashoffset',(C*(1-Math.max(0,Math.min(100,pct))/100)).toFixed(1));
  var t=el.parentNode.querySelector('text');if(t)t.textContent=Math.round(pct)+'%';
}

var ivIdx=0;
function submitAns(){
  var inp=document.getElementById('ans');var v=inp.value.trim();if(!v){toast('请先输入回答');return;}
  var chat=document.getElementById('chat');
  chat.innerHTML+=`<div class="bubble a"><span class="who">你</span>${esc(v)}</div>`;
  inp.value='';
  var q=DB.questions[ivIdx];
  var iv=DB.interviewers.find(function(x){return x.id===q.iv;});
  setTimeout(function(){
    var fu='为什么问这个？ '+['项目经历','岗位要求','当前回答'].join(' + ')+' → 触发追问';
    chat.innerHTML+=`<div class="bubble q"><span class="who">${iv.name} · 追问</span>${esc('能否具体讲讲你当时是如何确定核心需求的？')}</div><div class="small muted mt-8" style="margin-left:4px">${fu}</div>`;
    chat.scrollTop=chat.scrollHeight;
    ivIdx++;
    if(ivIdx<DB.questions.length){
      document.querySelectorAll('.flow-step').forEach(function(s){s.classList.remove('on');});
      var st=document.querySelector('.flow-step[data-i="'+ivIdx+'"]');if(st)st.classList.add('on');
      document.getElementById('round').textContent=ivIdx+1;
      var dn=document.getElementById('ivDone');if(dn)dn.textContent=Math.min(5,ivIdx+1);
      animateRing('ivRing',Math.min(100,(ivIdx+1)/5*100));
      chat.innerHTML+=`<div class="bubble q mt-8"><span class="who">面试官</span>${esc(DB.questions[ivIdx].q)}</div>`;
    } else {
      chat.innerHTML+=`<div class="bubble q mt-8"><span class="who">系统</span>面试已完成，正在进入综合评估…</div>`;
      animateRing('ivRing',100);var dn2=document.getElementById('ivDone');if(dn2)dn2.textContent=5;
      setAgentDone('Score');setAgentDone('Summary');setAgentDone('Interview');setAgentDone('Follow-up');
      var ags=document.getElementById('agentState');if(ags)ags.innerHTML=agentStateHtml();
      setTimeout(function(){go('#/u/multiagent');},900);
    }
    chat.scrollTop=chat.scrollHeight;
  },500);
}

function body2(r){return r;}

/* card helper used by dashboard */
function card(title,body){return `<div class="card"><div class="card-title"><span class="dot"></span>${title}</div><div class="mt-12">${body}</div></div>`;}

/* ---------------- router ---------------- */
function render(){
  var hash=(location.hash.replace(/^#/,'')||'u/dashboard').replace(/^\/+/,'');
  var role=hash.charAt(0)==='a'?'a':'u';
  var page=PAGES[hash]||PAGES[role+'/dashboard'];
  if(!PAGES[hash])hash=role+'/dashboard';
  var def=PAGES[hash];
  document.getElementById('sidebar').innerHTML=sidebar(hash);
  document.getElementById('topbar').innerHTML=
    `<div><h1>${esc(def.title)}</h1><div class="crumb">${esc(def.crumb||'')}</div></div>
     <div class="topbar-right"><span class="proto-flag">HIGH-FI PROTOTYPE</span><div class="avatar sm">🐱</div></div>`;
  var view=document.getElementById('view');
  view.innerHTML=def.render();
  view.scrollTop=0;window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);
window.addEventListener('DOMContentLoaded',function(){
  if(!location.hash)location.hash='#/u/dashboard';
  render();
});
/* expose for inline handlers */

window.showComp=showComp;window.switchWeight=switchWeight;window.pickDiff=pickDiff;
window.submitAns=submitAns;
})();
</script>
