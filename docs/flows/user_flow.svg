="1.7" fill="none" marker-end="url(#ah)"/><path d="M870,356 L870,524" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><path d="M550,576 L550,604" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><rect x="330" y="608" width="440" height="52" rx="9" fill="#FFFFFF" stroke="#E3DCCC" stroke-width="1.5"/><text x="550" y="632" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">岗位推荐</text><text x="550" y="652" text-anchor="middle" font-size="11.5" fill="#8A8475">Job Match · 确定性匹配引擎 · 11 个职位</text><path d="M550,660 L550,688" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><rect x="330" y="692" width="440" height="52" rx="9" fill="#FFFFFF" stroke="#E3DCCC" stroke-width="1.5"/><text x="550" y="716" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">JD 生成 / JD 解析</text><text x="550" y="736" text-anchor="middle" font-size="11.5" fill="#8A8475">粘贴文本 · JD 截图（走百度 OCR）</text><path d="M550,744 L550,772" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><rect x="330" y="776" width="440" height="52" rx="9" fill="#FFFFFF" stroke="#E3DCCC" stroke-width="1.5"/><text x="550" y="800" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">岗位能力模型</text><text x="550" y="820" text-anchor="middle" font-size="11.5" fill="#8A8475">Competency · 6 维 24 项 + 动态评分权重</text><path d="M550,828 L550,856" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><rect x="330" y="860" width="440" height="52" rx="9" fill="#FFFFFF" stroke="#E3DCCC" stroke-width="1.5"/><text x="550" y="884" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">AI 面试 + 动态追问</text><text x="550" y="904" text-anchor="middle" font-size="11.5" fill="#8A8475">Interview 50% 简历 + 30% JD + 20% 能力模型</text><path d="M550,912 L550,940" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><rect x="60" y="940" width="300" height="52" rx="9" fill="#FBF8F2"