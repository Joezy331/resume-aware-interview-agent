<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#A89F8C"/></marker>
</defs>
<rect x="0" y="0" width="1100" height="960" fill="#FAF7F0"/>
<rect x="0" y="0" width="1100" height="84" fill="url(#hg)"/>
<text x="550" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">外接大模型 API 调用流程 · LLM Call Flow</text>
<text x="550" y="70" text-anchor="middle" font-size="13" fill="#FFFFFF" opacity="0.9">出题 / 追问 / 评分 / 报告 / OCR 兜底均走同一链路（ai-chat IPC 代理）</text><rect x="430" y="100" width="240" height="44" rx="22" fill="#3A352C"/><text x="550" y="127" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">用户操作</text><path d="M550,144 L550,172" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><rect x="360" y="176" width="380" height="52" rx="9" fill="#FFFFFF" stroke="#E3DCCC" stroke-width="1.5"/><text x="550" y="200" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">前端业务模块</text><text x="550" y="220" text-anchor="middle" font-size="11.5" fill="#8A8475">出题 / 追问 / 评分 / 报告</text><path d="M550,228 L550,256" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><rect x="360" y="260" width="380" height="56" rx="9" fill="#FFFFFF" stroke="#E3DCCC" stroke-width="1.5"/><text x="550" y="284" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">请求组装 messages</text><text x="550" y="304" text-anchor="middle" font-size="11.5" fill="#8A8475">系统 Prompt + 用户输入 + 历史问答上下文</text><path d="M550,316 L550,344" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><rect x="330" y="348" width="440" height="56" rx="9" fill="#FFFFFF" stroke="#E3DCCC" stroke-width="1.5"/><text x="550" y="372" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">API 配置读取</text><text x="550" y="392" text-anchor="middle" font-size="11.5" fill="#8A8475">localStorage 覆盖 → 否则 local_api_config.json</text><path d="M550,404 L550,432" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><rect x="360" y="436" width="380" height="52" rx="9" fill="#FBF8F2" stroke="#DCD3C2" stroke-width="1.2"/><text x="550" y="460" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">IPC: ai-chat</text><text x="550" y="480" text-anchor="middle" font-size="11.5" fill="#8A8475">渲染进程 → 主进程（避免 CORS 与 Key 暴露）</text><path d="M550,488 L550,516" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><rect x="330" y="520" width="440" height="52" rx="9" fill="#FFFFFF" stroke="#E3DCCC" stroke-width="1.5"/><text x="550" y="544" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">主进程代理 fetch</text><text x="550" y="564" text-anchor="middle" font-size="11.5" fill="#8A8475">POST /chat/completions · 90s 超时 · max_tokens≤8192</text><path d="M550,572 L550,600" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><rect x="400" y="604" width="300" height="52" rx="9" fill="#FFFFFF" stroke="#C58A8A" stroke-width="1.5" stroke-dasharray="6 4"/><text x="550" y="628" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">外接大模型服务</text><text x="550" y="648" text-anchor="middle" font-size="11.5" fill="#8A8475">OpenAI 兼容 · localhost:8787/v1</text><path d="M700,630 L770,630" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><rect x="770" y="604" width="280" height="52" rx="9" fill="#FFFFFF" stroke="#E3DCCC" stroke-width="1.5"/><text x="910" y="628" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">返回结果解析</text><text x="910" y="648" text-anchor="middle" font-size="11.5" fill="#8A8475">choices[0].message.content</text><path d="M910,656 L910,684" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><polygon points="910,688 1050,720 910,752 770,720" fill="#F6ECEC" stroke="#C58A8A" stroke-width="1.5"/><text x="910" y="724" text-anchor="middle" font-size="13" font-weight="600" fill="#8A5A5A">内容有效？</text><path d="M910,752 L910,776" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><text x="936" y="766" text-anchor="middle" font-size="11.5" fill="#8A8475">是</text><rect x="400" y="776" width="300" height="52" rx="9" fill="#FFFFFF" stroke="#E3DCCC" stroke-width="1.5"/><text x="550" y="800" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">更新面试状态 / 页面</text><text x="550" y="820" text-anchor="middle" font-size="11.5" fill="#8A8475">动态追问使用最新回答 + 完整上下文</text><path d="M550,828 L550,856" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><rect x="400" y="856" width="300" height="52" rx="9" fill="#F2EFE7" stroke="#8A8475" stroke-width="1.5" stroke-dasharray="3 3"/><text x="550" y="880" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">保存必要历史数据</text><text x="550" y="900" text-anchor="middle" font-size="11.5" fill="#8A8475">面试结束后写入 localStorage</text><path d="M770,720 L300,720" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><text x="520" y="712" text-anchor="middle" font-size="11.5" fill="#8A8475">否</text><rect x="60" y="688" width="240" height="64" rx="9" fill="#FBF8F2" stroke="#DCD3C2" stroke-width="1.2"/><text x="180" y="712" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">异常处理</text><text x="180" y="732" text-anchor="middle" font-size="11.5" fill="#8A8475">网络失败 / 401 / 404 / 429 / 502 / 空内容 → 明确提示，不泄露 Key</text><path d="M180,752 L180,800" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><rect x="60" y="800" width="240" height="52" rx="9" fill="#FBF8F2" stroke="#DCD3C2" stroke-width="1.2"/><text x="180" y="824" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">用户可重试或切换模型</text><text x="180" y="844" text-anchor="middle" font-size="11.5" fill="#8A8475">设置页提供 5 个模型选项</text><path d="M300,720 L550,720 L550,776" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><line x1="60" y1="906" x2="1040" y2="906" stroke="#E3DCCC" stroke-width="1.2"/><rect x="60" y="920" width="26" height="16" rx="8" fill="#3A352C"/><text x="94" y="932" font-size="12" fill="#8A8475">用户操作</text><rect x="162" y="920" width="26" height="16" rx="4" fill="#FFFFFF" stroke="#E3DCCC" stroke-width="1.3"/><text x="196" y="932" font-size="12" fill="#8A8475">处理</text><rect x="240" y="920" width="26" height="16" rx="4" fill="#FFFFFF" stroke="#C58A8A" stroke-width="1.3" stroke-dasharray="5 3"/><text x="274" y="932" font-size="12" fill="#8A8475">外部模型服务</text><rect x="366" y="920" width="26" height="16" rx="4" fill="#F2EFE7" stroke="#8A8475" stroke-width="1.3" stroke-dasharray="3 3"/><text x="400" y="932" font-size="12" fill="#8A8475">本地存储</text></svg>