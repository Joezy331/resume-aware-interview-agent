<text x="550" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">13-Agent 系统架构 · Agent Architecture</text>
<text x="550" y="70" text-anchor="middle" font-size="13" fill="#FFFFFF" opacity="0.9">区分：真实 LLM Agent / 规则与函数模块 / 外部服务 / 本地存储</text><text x="60" y="122" font-size="13" font-weight="700" fill="#A97070">输入层</text><rect x="60" y="132" width="220" height="50" rx="9" fill="#3A352C" stroke="none"/><text x="170" y="156" text-anchor="middle" font-size="14.5" font-weight="600" fill="#FFFFFF">简历文件</text><text x="170" y="176" text-anchor="middle" font-size="11.5" fill="rgba(255,255,255,.85)">PDF / DOCX / TXT</text><rect x="300" y="132" width="220" height="50" rx="9" fill="#3A352C" stroke="none"/><text x="410" y="156" text-anchor="middle" font-size="14.5" font-weight="600" fill="#FFFFFF">简历图片</text><text x="410" y="176" text-anchor="middle" font-size="11.5" fill="rgba(255,255,255,.85)">截图 / 扫描件</text><rect x="540" y="132" width="220" height="50" rx="9" fill="#3A352C" stroke="none"/><text x="650" y="162" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">粘贴简历文本</text><rect x="780" y="132" width="250" height="50" rx="9" fill="#3A352C" stroke="none"/><text x="905" y="162" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">JD 截图 / JD 文本</text><text x="60" y="224" font-size="13" font-weight="700" fill="#A97070">外部服务层</text><rect x="60" y="234" width="320" height="50" rx="9" fill="#FFFFFF" stroke="#C58A8A" stroke-width="1.5" stroke-dasharray="6 4"/><text x="220" y="258" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">百度智能云 OCR</text><text x="220" y="278" text-anchor="middle" font-size="11.5" fill="#8A8475">accurate_basic 文字识别（工具调用，非 Agent）</text><rect x="400" y="234" width="320" height="50" rx="9" fill="#FFFFFF" stroke="#C58A8A" stroke-width="1.5" stroke-dasharray="6 4"/><text x="560" y="258" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">外接大模型服务</text><text x="560" y="278" text-anchor="middle" font-size="11.5" fill="#8A8475">OpenAI 兼容 · 多 Agent 共用</text><rect x="740" y="234" width="290" height="50" rx="9" fill="#F2EFE7" stroke="#8A8475" stroke-width="1.5" stroke-dasharray="3 3"/><text x="885" y="258" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">本地安全配置</text><text x="885" y="278" text-anchor="middle" font-size="11.5" fill="#8A8475">local_api_config.json（Key 不入源码）</text><text x="60" y="326" font-size="13" font-weight="700" fill="#A97070">解析与岗位匹配层</text><rect x="60" y="336" width="220" height="56" rx="9" fill="#FFFFFF" stroke="#E3DCCC" stroke-width="1.5"/><text x="170" y="360" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">① Resume Parser</text><text x="170" y="380" text-anchor="middle" font-size="11.5" fill="#8A8475">LLM Agent · 结构化抽取</text><rect x="300" y="336" width="220" height="56" rx="9" fill="#FFFFFF" stroke="#E3DCCC" stroke-width="1.5"/><text x="410" y="360" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">② Job Match</text><text x="410" y="380" text-anchor="middle" font-size="11.5" fill="#8A8475">规则引擎 · 11 职位匹配</text><rect x="540" y="336" width="220" height="56" rx="9" fill="#FFFFFF" stroke="#E3DCCC" stroke-width="1.5"/><text x="650" y="360" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">③ JD Agent</text><text x="650" y="380" text-anchor="middle" font-size="11.5" fill="#8A8475">LLM Agent · 生成/解析</text><rect x="780" y="336" width="250" height="56" rx="9" fill="#FFFFFF" stroke="#E3DCCC" stroke-width="1.5"/><text x="905" y="360" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">④ Competency</text><text x="905" y="380" text-anchor="middle" font-size="11.5" fill="#8A8475">规则模块 · 6 维能力树</text><text x="60" y="434" font-size="13" font-weight="700" fill="#A97070">面试与评价层</text><rect x="60" y="444" width="160" height="56" rx="9" fill="#FFFFFF" stroke="#E3DCCC" stroke-width="1.5"/><text x="140" y="468" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">⑤ Interview</text><text x="140" y="488" text-anchor="middle" font-size="11.5" fill="#8A8475">LLM Agent · 出题</text><rect x="240" y="444" width="160" height="56" rx="9" fill="#FFFFFF" stroke="#E3DCCC" stroke-width="1.5"/><text x="320" y="468" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">⑥ Follow-up</text><text x="320" y="488" text-anchor="middle" font-size="11.5" fill="#8A8475">LLM Agent · 追问</text><rect x="420" y="444" width="200" height="56" rx="9" fill="#FFFFFF" stroke="#E3DCCC" stroke-width="1.5"/><text x="520" y="468" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">⑦-⑩ 四位面试官</text><text x="520" y="488" text-anchor="middle" font-size="11.5" fill="#8A8475">HR / 业务 / 专业 / 主管</text><rect x="640" y="444" width="180" height="56" rx="9" fill="#FFFFFF" stroke="#E3DCCC" stroke-width="1.5"/><text x="730" y="468" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">⑪ Chief Eval</text><text x="730" y="488" text-anchor="middle" font-size="11.5" fill="#8A8475">LLM Agent · 冲突仲裁</text><rect x="840" y="444" width="190" height="56" rx="9" fill="#FFFFFF" stroke="#E3DCCC" stroke-width="1.5"/><text x="935" y="468" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">⑫ Score</text><text x="935" y="488" text-anchor="middle" font-size="11.5" fill="#8A8475">规则 · 动态权重</text><text x="60" y="542" font-size="13" font-weight="700" fill="#A97070">数据与报告层</text><rect x="60" y="552" width="220" height="56" rx="9" fill="#FFFFFF" stroke="#E3DCCC" stroke-width="1.5"/><text x="170" y="576" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">⑬ Summary Agent</text><text x="170" y="596" text-anchor="middle" font-size="11.5" fill="#8A8475">LLM Agent · 报告+成长计划</text><rect x="300" y="552" width="220" height="56" rx="9" fill="#FFFFFF" stroke="#E3DCCC" stroke-width="1.5"/><text x="410" y="576" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">报告渲染 + 雷达图</text><text x="410" y="596" text-anchor="middle" font-size="11.5" fill="#8A8475">Chart.js · 6 维可视化</text><rect x="540" y="552" width="220" height="56" rx="9" fill="#F2EFE7" stroke="#8A8475" stroke-width="1.5" stroke-dasharray="3 3"/><text x="650" y="576" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">历史记录存储</text><text x="650" y="596" text-anchor="middle" font-size="11.5" fill="#8A8475">localStorage（本次新增）</text><rect x="780" y="552" width="250" height="56" rx="9" fill="#FFFFFF" stroke="#E3DCCC" stroke-width="1.5"/><text x="905" y="576" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">Dashboard / Agent 监控</text><text x="905" y="596" text-anchor="middle" font-size="11.5" fill="#8A8475">指标 + 13-Agent 管线可视化</text><path d="M170,182 L170,234" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><path d="M560,182 L560,234" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><path d="M170,284 L170,336" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><path d="M410,284 L410,336" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><path d="M900,284 L900,336" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><path d="M170,392 L170,444" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><path d="M410,392 L410,444" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><path d="M520,472 L640,472" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><path d="M820,472 L840,472" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><path d="M935,500 L935,552" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><path d="M410,500 L410,552" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><path d="M520,580 L540,580" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><path d="M760,580 L780,580" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><line x1="60" y1="632" x2="1040" y2="632" stroke="#E3DCCC" stroke-width="1.2"/><text x="60" y="656" font-size="12" fill="#8A8475">①③⑤⑥⑦⑧⑨⑩⑪⑬ 为真实 LLM Agent（经外接大模型生成内容）；②④⑫ 为规则/函数模块；OCR 为外部工具调用；历史记录为本地存储。</text><text x="60" y="678" font-size="12" fill="#8A8475">追问链路：Follow-up 使用用户最新回答 + 完整历史上下文（interviewState.answers），非固定问题序列。</text><line x1="60" y1="690" x2="1040" y2="690" stroke="#E3DCCC" stroke-width="1.2"/><rect x="60" y="704" width="26" height="16" rx="8" fill="#3A352C"/><text x="94" y="716" font-size="12" fill="#8A8475">输入</text><rect x="138" y="704" width="26" height="16" rx="4" fill="#FFFFFF" stroke="#E3DCCC" stroke-width="1.3"/><text x="172" y="716" font-size="12" fill="#8A8475">LLM Agent</text><rect x="300" y="704" width="26" height="16" rx="4" fill="#FFFFFF" stroke="#C58A8A" stroke-width="1.3" stroke-dasharray="5 3"/><text x="334" y="716" font-size="12" fill="#8A8475">外部服务</text><rect x="402" y="704" width="26" height="16" rx="4" fill="#F2EFE7" stroke="#8A8475" stroke-width="1.3" stroke-dasharray="3 3"/><text x="436" y="716" font-size="12" fill="#8A8475">本地存储</text></svg>