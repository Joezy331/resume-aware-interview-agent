<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#A89F8C"/></marker>
</defs>
<rect x="0" y="0" width="1100" height="800" fill="#FAF7F0"/>
<rect x="0" y="0" width="1100" height="84" fill="url(#hg)"/>
<text x="550" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">用户历史记录流程 · History Data Flow</text>
<text x="550" y="70" text-anchor="middle" font-size="13" fill="#FFFFFF" opacity="0.9">本次迭代新增：localStorage 持久化（键 acc_history_v1），关闭重开不丢失</text><rect x="430" y="100" width="240" height="44" rx="22" fill="#3A352C"/><text x="550" y="127" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">面试完成</text><path d="M550,144 L550,172" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><rect x="330" y="176" width="440" height="56" rx="9" fill="#FFFFFF" stroke="#E3DCCC" stroke-width="1.5"/><text x="550" y="200" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">组装面试记录</text><text x="550" y="220" text-anchor="middle" font-size="11.5" fill="#8A8475">会话 ID · 时间 · 目标岗位 · 难度 · 状态 · 总分</text><path d="M550,232 L550,260" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><rect x="330" y="264" width="440" height="56" rx="9" fill="#FFFFFF" stroke="#E3DCCC" stroke-width="1.5"/><text x="550" y="288" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">附完整过程数据</text><text x="550" y="308" text-anchor="middle" font-size="11.5" fill="#8A8475">每轮问答 / 追问 / 各面试官评分 / 最终报告 / 成长建议</text><path d="M550,320 L550,348" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><rect x="360" y="352" width="380" height="52" rx="9" fill="#F2EFE7" stroke="#8A8475" stroke-width="1.5" stroke-dasharray="3 3"/><text x="550" y="376" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">写入 localStorage</text><text x="550" y="396" text-anchor="middle" font-size="11.5" fill="#8A8475">JSON 数组 · 时间倒序 · 容量异常时提示</text><path d="M550,404 L550,432" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><polygon points="550,436 700,466 550,496 400,466" fill="#F6ECEC" stroke="#C58A8A" stroke-width="1.5"/><text x="550" y="470" text-anchor="middle" font-size="13" font-weight="600" fill="#8A5A5A">保存成功？</text><path d="M550,496 L550,524" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><text x="576" y="514" text-anchor="middle" font-size="11.5" fill="#8A8475">是</text><rect x="360" y="524" width="380" height="52" rx="9" fill="#FFFFFF" stroke="#E3DCCC" stroke-width="1.5"/><text x="550" y="548" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">历史记录列表</text><text x="550" y="568" text-anchor="middle" font-size="11.5" fill="#8A8475">时间 / 岗位 / 难度 / 状态 / 总分 · 空状态引导</text><path d="M550,576 L550,604" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><rect x="360" y="604" width="380" height="56" rx="9" fill="#FFFFFF" stroke="#E3DCCC" stroke-width="1.5"/><text x="550" y="628" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">历史详情还原</text><text x="550" y="648" text-anchor="middle" font-size="11.5" fill="#8A8475">问题 · 回答 · 追问 · 评分 · 报告 · 旧记录缺字段兼容展示</text><path d="M740,632 L830,632" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><rect x="830" y="604" width="220" height="64" rx="9" fill="#FBF8F2" stroke="#DCD3C2" stroke-width="1.2"/><text x="940" y="628" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">删除记录</text><text x="940" y="648" text-anchor="middle" font-size="11.5" fill="#8A8475">弹窗确认后移除</text><path d="M940,668 L940,700 L200,700 L200,632" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><rect x="60" y="604" width="220" height="56" rx="9" fill="#FBF8F2" stroke="#DCD3C2" stroke-width="1.2"/><text x="170" y="628" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">再次面试</text><text x="170" y="648" text-anchor="middle" font-size="11.5" fill="#8A8475">回到面试流程闭环</text><path d="M400,466 L330,466" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><text x="365" y="458" text-anchor="middle" font-size="11.5" fill="#8A8475">否</text><rect x="60" y="436" width="270" height="60" rx="9" fill="#FBF8F2" stroke="#DCD3C2" stroke-width="1.2"/><text x="195" y="460" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">保存失败提示</text><text x="195" y="480" text-anchor="middle" font-size="11.5" fill="#8A8475">明确告知用户，不静默丢失数据</text><path d="M195,496 L195,532" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><rect x="60" y="532" width="270" height="56" rx="9" fill="#FFFFFF" stroke="#E3DCCC" stroke-width="1.5"/><text x="195" y="556" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">数据兼容策略</text><text x="195" y="576" text-anchor="middle" font-size="11.5" fill="#8A8475">旧版本无记录 → 空状态；新字段缺失 → 默认值展示</text><line x1="60" y1="706" x2="1040" y2="706" stroke="#E3DCCC" stroke-width="1.2"/><rect x="60" y="720" width="26" height="16" rx="8" fill="#3A352C"/><text x="94" y="732" font-size="12" fill="#8A8475">开始/结束</text><rect x="174" y="720" width="26" height="16" rx="4" fill="#FFFFFF" stroke="#E3DCCC" stroke-width="1.3"/><text x="208" y="732" font-size="12" fill="#8A8475">处理</text><rect x="252" y="720" width="26" height="16" rx="4" fill="#F2EFE7" stroke="#8A8475" stroke-width="1.3" stroke-dasharray="3 3"/><text x="286" y="732" font-size="12" fill="#8A8475">本地存储(localStorage)</text><text x="556" y="732" font-size="12" fill="#8A8475">提示/分支</text></svg>