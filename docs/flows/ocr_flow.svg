<svg viewBox="0 0 1100 880" width="1100" height="880" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans SC','Inter','PingFang SC','Microsoft YaHei',sans-serif">
<defs>
<linearGradient id="hg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C58A8A"/><stop offset="1" stop-color="#A97070"/></linearGradient>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#A89F8C"/></marker>
</defs>
<rect x="0" y="0" width="1100" height="880" fill="#FAF7F0"/>
<rect x="0" y="0" width="1100" height="84" fill="url(#hg)"/>
<text x="550" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">百度智能云 OCR 子流程 · OCR Sub-Flow</text>
<text x="550" y="70" text-anchor="middle" font-size="13" fill="#FFFFFF" opacity="0.9">仅支持简历图片与 JD 截图；PDF/DOCX/TXT 不走 OCR</text><rect x="430" y="100" width="240" height="44" rx="22" fill="#3A352C"/><text x="550" y="127" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">用户选择图片</text><path d="M550,144 L550,172" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><rect x="380" y="176" width="340" height="52" rx="9" fill="#FFFFFF" stroke="#E3DCCC" stroke-width="1.5"/><text x="550" y="200" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">格式与大小校验</text><text x="550" y="220" text-anchor="middle" font-size="11.5" fill="#8A8475">image/* · 超大图自动压缩</text><path d="M550,228 L550,256" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><rect x="380" y="260" width="340" height="52" rx="9" fill="#FFFFFF" stroke="#E3DCCC" stroke-width="1.5"/><text x="550" y="284" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">读取图片 → base64</text><text x="550" y="304" text-anchor="middle" font-size="11.5" fill="#8A8475">去除 data:image 前缀</text><path d="M550,312 L550,340" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><rect x="380" y="344" width="340" height="52" rx="9" fill="#FFFFFF" stroke="#E3DCCC" stroke-width="1.5"/><text x="550" y="368" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">IPC: baidu-ocr</text><text x="550" y="388" text-anchor="middle" font-size="11.5" fill="#8A8475">密钥仅主进程从本地配置读取</text><path d="M550,396 L550,424" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><rect x="380" y="428" width="340" height="52" rx="9" fill="#FFFFFF" stroke="#C58A8A" stroke-width="1.5" stroke-dasharray="6 4"/><text x="550" y="452" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">百度文字识别（高精度版）</text><text x="550" y="472" text-anchor="middle" font-size="11.5" fill="#8A8475">accurate_basic · 专用 OCR 3-8 秒</text><path d="M550,480 L550,508" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><polygon points="550,512 700,544 550,576 400,544" fill="#F6ECEC" stroke="#C58A8A" stroke-width="1.5"/><text x="550" y="548" text-anchor="middle" font-size="13" font-weight="600" fill="#8A5A5A">识别有效？</text><path d="M700,544 L770,544" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><text x="735" y="536" text-anchor="middle" font-size="11.5" fill="#8A8475">是</text><rect x="770" y="512" width="280" height="64" rx="9" fill="#FFFFFF" stroke="#E3DCCC" stroke-width="1.5"/><text x="910" y="536" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">文本清洗</text><text x="910" y="556" text-anchor="middle" font-size="11.5" fill="#8A8475">OCR 只识别文字；语义理解与信息抽取由后续 LLM 模块完成</text><path d="M910,576 L910,604" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><rect x="700" y="604" width="380" height="52" rx="9" fill="#FFFFFF" stroke="#E3DCCC" stroke-width="1.5"/><text x="890" y="628" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">填充简历 / JD 解析模块</text><text x="890" y="648" text-anchor="middle" font-size="11.5" fill="#8A8475">用户确认、修改或重新识别</text><path d="M400,544 L330,544" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><text x="365" y="536" text-anchor="middle" font-size="11.5" fill="#8A8475">否</text><rect x="60" y="512" width="270" height="64" rx="9" fill="#FBF8F2" stroke="#DCD3C2" stroke-width="1.2"/><text x="195" y="536" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">失败处理</text><text x="195" y="556" text-anchor="middle" font-size="11.5" fill="#8A8475">未配置 / 网络异常 / 权限错误 / 空结果 → 明确提示</text><path d="M195,576 L195,640" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><rect x="60" y="640" width="270" height="64" rx="9" fill="#FFFFFF" stroke="#E3DCCC" stroke-width="1.5"/><text x="195" y="664" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">回退策略</text><text x="195" y="684" text-anchor="middle" font-size="11.5" fill="#8A8475">简历图片 → 多模态竞速；JD 图片 → 提示改用粘贴文本</text><path d="M195,704 L195,740" stroke="#A89F8C" stroke-width="1.7" fill="none" marker-end="url(#ah)"/><rect x="60" y="740" width="270" height="52" rx="9" fill="#FBF8F2" stroke="#DCD3C2" stroke-width="1.2"/><text x="195" y="764" text-anchor="middle" font-size="14.5" font-weight="600" fill="#3A352C">不破坏原文本输入流程</text><text x="195" y="784" text-anchor="middle" font-size="11.5" fill="#8A8475">OCR 失败可继续手动输入</text><line x1="60" y1="812" x2="1040" y2="812" stroke="#E3DCCC" stroke-width="1.2"/><text x="60" y="838" font-size="12" fill="#8A8475">注：百度 NLP 关键词接口因权限受限（error 6）已弃用；「粘贴 JD 文本 → 渲染 PNG → 百度 OCR 高精度版提取关键词」为当前替代实现。</text></svg>